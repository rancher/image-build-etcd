---
name: "Update etcd minor versions"

sources:
  etcd:
    name: "Get the three latest etcd minor tags"
    kind: shell
    spec:
      shell: /bin/bash
      command: |
        set -euo pipefail
        versions="$({
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'Authorization: Bearer {{ requiredEnv .github.token }}' \
            'https://api.github.com/repos/k3s-io/etcd/tags?per_page=100' |
            jq -r '.[].name' |
            sort -rV | awk -F. '!minor[$2]++' |
            head -n 2
        })"

        if [[ "$(printf '%s\n' "$versions" | wc -l)" -ne 2 ]]; then
          echo "Expected two etcd minor versions, found: $versions" >&2
          exit 1
        fi

        # Make sure the -k3s[0-9] suffix in the versions
        if [[ "$(printf '%s\n' "$versions" ) | grep -vE '^-k3s[0-9]+$' | wc -l)" -ne 0 ]]; then
          echo "Expected versions to have the -k3s[0-9] suffix, found: $versions" >&2
          exit 1
        fi

        printf '%s\n' "$versions"

targets:
  tagfile:
    name: "Bump the two latest etcd minor versions in TAG"
    kind: file
    sourceid: etcd
    scmid: default
    spec:
      file: TAG

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'

actions:
  default:
    title: 'Bump the two latest etcd minor versions'
    kind: github/pullrequest
    spec:
      merge:
        strategy: auto
      labels:
        - updatecli
    scmid: default
